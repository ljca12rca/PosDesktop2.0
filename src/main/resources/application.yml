spring:
  application:
    name: posdesktop-backend
  datasource:
    url: ${POS_PG_URL:jdbc:postgresql://localhost:5432/posdesktop}
    username: ${POS_PG_USERNAME:pos}
    password: ${POS_PG_PASSWORD:pos123}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    mongodb:
      uri: ${POS_MONGO_URI:mongodb://pos:pos123@localhost:27017/posdesktop_media?authSource=admin}

management:
  endpoints:
    web:
      exposure:
        include: health,info
