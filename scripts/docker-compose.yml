services:
  postgres:
    image: postgres:17
    container_name: posdesktop-postgres
    environment:
      POSTGRES_DB: posdesktop
      POSTGRES_USER: pos
      POSTGRES_PASSWORD: pos123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mongo:
    image: mongo:8
    container_name: posdesktop-mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: pos
      MONGO_INITDB_ROOT_PASSWORD: pos123
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  postgres_data:
  mongo_data:
