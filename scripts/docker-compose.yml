services:
  api:
    image: ${POS_API_IMAGE:-ghcr.io/ljca12rca/posdesktop-api:latest}
    container_name: posdesktop-api
    pull_policy: always
    restart: always
    environment:
      POS_API_PORT: 8083
      POS_PG_URL: jdbc:postgresql://postgres:5432/posdesktop
      POS_PG_USERNAME: pos
      POS_PG_PASSWORD: pos123
      POS_MONGO_HOST: mongo
      POS_MONGO_PORT: 27017
      POS_MONGO_DATABASE: posdesktop_media
      POS_MONGO_USERNAME: pos
      POS_MONGO_PASSWORD: pos123
      POS_MONGO_AUTH_DB: admin
      POS_DOCUMENT_STORAGE_ROOT: /var/posdesktop-media
      JAVA_OPTS: -XX:MaxRAMPercentage=75.0 -Djava.security.egd=file:/dev/./urandom
    ports:
      - "8083:8083"
    volumes:
      - api_documents:/var/posdesktop-media
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8083/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s
    networks:
      - pos-network

  postgres:
    image: postgres:17
    container_name: posdesktop-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: posdesktop
      POSTGRES_USER: pos
      POSTGRES_PASSWORD: pos123
    ports:
      - "55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pos -d posdesktop"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - pos-network

  mongo:
    image: mongo:8
    container_name: posdesktop-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: pos
      MONGO_INITDB_ROOT_PASSWORD: pos123
      MONGO_INITDB_DATABASE: posdesktop_media
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "echo 'db.runCommand({ ping: 1 }).ok' | mongosh mongodb://pos:pos123@localhost:27017/admin --quiet"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    networks:
      - pos-network

volumes:
  api_documents:
  postgres_data:
  mongo_data:

networks:
  pos-network:
    driver: bridge
