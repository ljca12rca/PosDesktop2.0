spring:
  application:
    name: posdesktop-backend
  datasource:
    url: ${POS_PG_URL:jdbc:postgresql://localhost:55432/posdesktop}
    username: ${POS_PG_USERNAME:pos}
    password: ${POS_PG_PASSWORD:pos123}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  mongodb:
    host: ${POS_MONGO_HOST:localhost}
    port: ${POS_MONGO_PORT:27018}
    database: ${POS_MONGO_DATABASE:posdesktop_media}
    username: ${POS_MONGO_USERNAME:pos_app}
    password: ${POS_MONGO_PASSWORD:pos123}
    authentication-database: ${POS_MONGO_AUTH_DB:posdesktop_media}

server:
  port: ${POS_API_PORT:8083}

management:
  endpoints:
    web:
      exposure:
        include: health,info

pos:
  timezone: ${POS_TIMEZONE:America/Bogota}
  ventas:
    local-prefix: ${POS_VENTAS_LOCAL_PREFIX:VTA}
  api:
    application-name: POS Desktop API
    version: v1
    environment: local
    desktop-mock-enabled: true
    documentos:
      storage-root: ${POS_DOCUMENT_STORAGE_ROOT:${user.home}/posdesktop-media}
  auth:
    session-hours: ${POS_AUTH_SESSION_HOURS:12}
  facturacion-electronica:
    # El modulo queda aislado hasta que se habilite explicitamente con credenciales de sandbox/produccion.
    dataico:
      enabled: true
      base-url: ${POS_DATAICO_BASE_URL:https://api.dataico.com/direct/dataico_api/v2}
      account-id: 002979c5-7c23-43ab-aa98-3fa7dce6e4d0
      auth-token: dtk_l-1PVfXB3aqaoe8-73rl7aO4G627Zvq762vqTFXZvmA
      configured-auth-token: dtk_l-1PVfXB3aqaoe8-73rl7aO4G627Zvq762vqTFXZvmA
      # Este prefijo corresponde únicamente a la numeración autorizada en Dataico.
      # No interviene en la numeración interna de ventas (pos.ventas.local-prefix).
      prefix: FEE
      resolution-number: 18760000001
      initial-number: 1789500096
      flexible: true
      # La numeración FEE / 18760000001 consultada en Dataico corresponde a PRODUCCION.
      environment: PRODUCCION
      connect-timeout: ${POS_DATAICO_CONNECT_TIMEOUT:5s}
      read-timeout: ${POS_DATAICO_READ_TIMEOUT:30s}
